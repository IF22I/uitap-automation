name: Python Playwright Tests

on:
  push:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser to run tests on'
        required: false
        default: 'chromium'
        type: choice
        options:
          - chromium
          - firefox
          - webkit
      test_group:
        description: 'Test group'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - regression

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd python-playwright
          pip install -r requirements.txt

      - name: Install Playwright system dependencies
        timeout-minutes: 8
        run: |
          cd python-playwright
          playwright install-deps ${{ github.event.inputs.browser || 'chromium' }}

      - name: Install Playwright browser
        id: browser
        timeout-minutes: 8
        run: |
          cd python-playwright
          playwright install ${{ github.event.inputs.browser || 'chromium' }}

      - name: Run pytest tests
        run: |
          cd python-playwright
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.test_group }}" = "regression" ]; then
            pytest -m regression --browser ${{ github.event.inputs.browser || 'chromium' }} --alluredir=allure-results
          else
            pytest -m smoke --browser ${{ github.event.inputs.browser || 'chromium' }} --alluredir=allure-results
          fi
        
      - name: Run Behave BDD tests
        if: (success() || failure()) && steps.browser.outcome == 'success'
        run: |
          cd python-playwright
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.test_group }}" = "regression" ]; then
            behave features/ --tags=@regression -D browser=${{ github.event.inputs.browser || 'chromium' }}
          else
            behave features/ --tags=@smoke -D browser=${{ github.event.inputs.browser || 'chromium' }}
          fi

      - name: Load previous report history
        if: always() && github.ref == 'refs/heads/main'
        run: |
          git fetch origin gh-pages-src
          git worktree add pages-src origin/gh-pages-src
          mkdir -p python-playwright/allure-results/history
          if [ -d pages-src/python/history ]; then
            cp -r pages-src/python/history/. python-playwright/allure-results/history/
          fi
          echo "History files loaded: $(ls python-playwright/allure-results/history | wc -l) of 5"

      - name: Generate Allure report
        if: always()
        run: |
          npm install -g allure-commandline --save-dev
          allure generate python-playwright/allure-results --clean -o python-playwright/allure-report

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: python-playwright/allure-report

      - name: Publish Python report to combined site branch
        if: always() && github.ref == 'refs/heads/main'
        run: |
          rm -rf pages-src/python
          mkdir -p pages-src/python
          cp -r python-playwright/allure-report/* pages-src/python/
          cd pages-src
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add python
          git commit -m "chore: update python allure report [skip ci]" || echo "Nothing to commit"
          git push origin HEAD:gh-pages-src || (git pull --rebase origin gh-pages-src && git push origin HEAD:gh-pages-src)

      - name: Upload Pages artifact
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-src

  deploy:
    needs: test
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4