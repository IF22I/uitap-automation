name: Python Playwright Tests

on:
  push:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser to run tests on'
        required: false
        default: 'chromium'
        type: choice
        options:
          - chromium
          - firefox
          - webkit
      test_group:
        description: 'Test group'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - regression

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd python-playwright
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          cd python-playwright
          playwright install --with-deps

      - name: Run pytest tests
        run: |
          cd python-playwright
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.test_group }}" = "regression" ]; then
            pytest -m regression --browser ${{ github.event.inputs.browser || 'chromium' }} --alluredir=allure-results
          else
            pytest -m smoke --browser ${{ github.event.inputs.browser || 'chromium' }} --alluredir=allure-results
          fi
        
      - name: Run Behave BDD tests
        run: |
          cd python-playwright
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.test_group }}" = "regression" ]; then
            behave features/ --tags=@regression -D browser=${{ github.event.inputs.browser || 'chromium' }}
          else
            behave features/ --tags=@smoke -D browser=${{ github.event.inputs.browser || 'chromium' }}
          fi

      - name: Generate Allure report
        if: always()
        run: |
          npm install -g allure-commandline --save-dev
          allure generate python-playwright/allure-results --clean -o python-playwright/allure-report

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: python-playwright/allure-report

      - name: Upload Pages artifact
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: python-playwright/allure-report

  deploy:
    needs: test
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4