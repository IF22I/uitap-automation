name: Python API Tests

on:
  push:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      test_group:
        description: 'Test group'
        required: true
        default: 'regression'
        type: choice
        options:
          - smoke
          - regression

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: python-api/requirements.txt

      - name: Install dependencies
        run: |
          cd python-api
          pip install -r requirements.txt

      - name: Run API tests
        run: |
          cd python-api
          if [ "${{ github.event.inputs.test_group }}" = "smoke" ]; then
            pytest -m smoke -v --alluredir=allure-results
          else
            pytest -m regression -v --alluredir=allure-results
          fi

      - name: Download previous report history
        if: always() && github.ref == 'refs/heads/main'
        run: |
          mkdir -p python-api/allure-results/history
          for file in history.json history-trend.json categories-trend.json duration-trend.json retry-trend.json; do
            curl -f -s -o "python-api/allure-results/history/$file" \
              "https://if22i.github.io/uitap-automation/api/history/$file" || true
          done

      - name: Generate Allure report
        if: always()
        run: |
          npm install -g allure-commandline --save-dev
          allure generate python-api/allure-results --clean -o python-api/allure-report

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-allure-report
          path: python-api/allure-report

      - name: Publish API report to combined site branch
        if: always() && github.ref == 'refs/heads/main'
        run: |
          git fetch origin gh-pages-src
          git worktree add pages-src origin/gh-pages-src
          rm -rf pages-src/api
          mkdir -p pages-src/api
          cp -r python-api/allure-report/* pages-src/api/
          cd pages-src
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add api
          git commit -m "chore: update api allure report [skip ci]" || echo "Nothing to commit"
          git push origin HEAD:gh-pages-src || (git pull --rebase origin gh-pages-src && git push origin HEAD:gh-pages-src)

      - name: Upload Pages artifact
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-src

  deploy:
    needs: test
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4