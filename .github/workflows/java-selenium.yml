name: Java Selenium Tests

on:
  push:
  schedule:
      - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser to run tests on'
        required: false
        default: 'chrome'
        type: choice
        options:
          - chrome
          - firefox

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Run TestNG tests
        run: |
          cd java-selenium
          if [ "${{ github.event_name }}" = "schedule" ]; then
            mvn test -Dgroups=regression -Dbrowser=${{ github.event.inputs.browser || 'chrome' }}
          else
            mvn test -Dgroups=smoke -Dbrowser=${{ github.event.inputs.browser || 'chrome' }}
          fi
          
      - name: Run Cucumber BDD tests
        run: |
          cd java-selenium
          if [ "${{ github.event_name }}" = "schedule" ]; then
            mvn test -Dtest=TestRunner -Dcucumber.filter.tags="@regression"
          else
            mvn test -Dtest=TestRunner -Dcucumber.filter.tags="@smoke"
          fi         

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: java-selenium/target/surefire-reports
