name: Java Selenium Tests

on:
  push:
  schedule:
      - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser to run tests on'
        required: false
        default: 'chrome'
        type: choice
        options:
          - chrome
          - firefox
      test_group:
        description: 'Test group to run'
        required: false
        default: 'smoke'
        type: choice
        options:
          - smoke
          - regression

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Run TestNG tests
        run: |
          cd java-selenium
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.test_group }}" = "regression" ]; then
            mvn test -Dgroups=regression -Dbrowser=${{ github.event.inputs.browser || 'chrome' }}
          else
            mvn test -Dgroups=smoke -Dbrowser=${{ github.event.inputs.browser || 'chrome' }}
          fi
          
      - name: Run Cucumber BDD tests
        run: |
          cd java-selenium
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.test_group }}" = "regression" ]; then
            mvn test -Dtest=TestRunner -Dcucumber.filter.tags="@regression" -Dbrowser=${{ github.event.inputs.browser || 'chrome' }}
          else
            mvn test -Dtest=TestRunner -Dcucumber.filter.tags="@smoke" -Dbrowser=${{ github.event.inputs.browser || 'chrome' }}
          fi  

      - name: Generate Allure report
        if: always()
        run: |
          cd java-selenium
          npm install -g allure-commandline --save-dev
          allure generate allure-results --clean -o allure-report

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: java-selenium/allure-report

      - name: Publish Java report to combined site branch
        if: always() && github.ref == 'refs/heads/main'
        run: |
          git fetch origin gh-pages-src
          git worktree add pages-src origin/gh-pages-src
          rm -rf pages-src/java
          mkdir -p pages-src/java
          cp -r java-selenium/allure-report/* pages-src/java/
          cd pages-src
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add java
          git commit -m "chore: update java allure report [skip ci]" || echo "Nothing to commit"
          git push origin HEAD:gh-pages-src || (git pull --rebase origin gh-pages-src && git push origin HEAD:gh-pages-src)

      - name: Upload Pages artifact
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-src

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: java-selenium/target/surefire-reports

      - name: Upload Cucumber reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-reports
          path: java-selenium/target/cucumber-reports.html

  deploy:
    needs: test
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4